name: API & Web UI Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build and Start API
        run: |
          ./gradlew build
          nohup java -jar build/libs/*.jar &

      - name: Run API Test
        run: ./gradlew test --tests "com.example.api.ApiTest"

      - name: Run Web UI Test
        run: ./gradlew test --tests "com.example.api.WebTest"

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: build/reports/tests